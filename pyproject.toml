[project]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = [
    {name = "Vitaliy Knysh",email = "vitaliy.knysh1234@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
