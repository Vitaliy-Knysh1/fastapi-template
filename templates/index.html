{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<section class="hero">
  <h1>Videogame Store</h1>
  <p class="lead">Browse titles below — prices in UAH.</p>
</section>

<section class="catalog" aria-label="Game catalog">
  <div class="catalog-grid">
    {% for game in games %}
    <article class="game-card">
      <a class="game-card-link" href="/games/{{ game.slug }}">
        <img
          class="game-cover"
          src="/static/{{ game.thumbnail_path }}"
          alt="{{ game.title }}"
          width="410"
          height="550"
          loading="lazy"
        />
      </a>
      <h2 class="game-title">
        <a href="/games/{{ game.slug }}">{{ game.title }}</a>
      </h2>
      <p class="game-price">{{ game.price_uah }}&nbsp;₴</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
