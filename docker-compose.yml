services:
  web:
    build: .
    container_name: fastapi-web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      JWT_SECRET: dev-docker-compose-jwt-secret-not-for-production-use-env-in-real-deploy
      # Pick up code edits without rebuilding the image (dev convenience).
      UVICORN_RELOAD: "1"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: fastapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fastapi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - web
      - db
      - cadvisor
      - postgres_exporter

  grafana:
    image: grafana/grafana:11.2.2
    container_name: fastapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://grafana_renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - grafana_renderer

  grafana_renderer:
    image: grafana/grafana-image-renderer:3.12.2
    container_name: fastapi-grafana-renderer
    environment:
      ENABLE_METRICS: "true"
    ports:
      - "8081:8081"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: fastapi-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastapi-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@db:5432/app?sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data:
  grafana_data:

