[tool.poetry]
name = "luckygames-shop"
version = "0.1.0"
description = "Luckygames Shop — FastAPI storefront template"
authors = ["Vitaliy Knysh <vitaliy.knysh1234@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.135.1,<0.136.0"
uvicorn = ">=0.42.0,<0.43.0"
pydantic-settings = ">=2.6,<3.0"
email-validator = ">=2,<3"
sqlalchemy = {version = ">=2.0,<3.0", extras = ["asyncio"]}
psycopg = {version = ">=3.1,<4", extras = ["binary"]}
alembic = ">=1.13,<2.0"
psycopg2-binary = ">=2.9,<3.0"
bcrypt = ">=4.1,<5"
python-jose = {version = ">=3.3,<4", extras = ["cryptography"]}
jinja2 = ">=3.1,<4"
prometheus-client = ">=0.20,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
httpx = ">=0.27,<1.0"
pytest-html = "^4.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
