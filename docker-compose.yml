services:
  web:
    build: .
    container_name: fastapi-web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      JWT_SECRET: dev-docker-compose-jwt-secret-not-for-production-use-env-in-real-deploy
      # Pick up code edits without rebuilding the image (dev convenience).
      UVICORN_RELOAD: "1"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: fastapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

